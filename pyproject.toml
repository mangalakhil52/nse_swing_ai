[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nse_swing_ai"
version = "1.0.0"
description = "Production-Grade Multi-Agent AI Indian Stock Swing Trading System"
readme = "ARCHITECTURE.md"
requires-python = ">=3.11"
authors = [
    { name = "Quant Trading Desk", email = "desk@quant.local" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "sqlalchemy>=2.0.29",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "greenlet>=3.0.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
