name: Frozen 4-4 Confluence OOS

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'OOS start date'
        required: true
        default: '2025-08-01'
      end_date:
        description: 'OOS end date'
        required: true
        default: '2026-08-24'

jobs:
  oos:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 180
    steps:
      - name: Checkout frozen strategy branch
        uses: actions/checkout@v4
        with:
          ref: feat/oos-validation-runner-9
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build historical dataset
        run: python scripts/build_oos_dataset.py --start '2023-07-26' --end '${{ inputs.end_date }}' --output artifacts/oos_data
      - name: Run frozen 4/4 OOS test
        run: python scripts/run_confluence_oos.py --data-dir artifacts/oos_data --start '${{ inputs.start_date }}' --end '${{ inputs.end_date }}' --output artifacts/confluence_oos.json
      - name: Upload OOS report
        uses: actions/upload-artifact@v4
        with:
          name: confluence-oos-report
          path: artifacts/confluence_oos.json
