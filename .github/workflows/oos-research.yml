name: NSE OOS Strategy Research

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: Historical start date (YYYY-MM-DD)
        required: true
        default: '2022-01-01'
      end_date:
        description: Historical end date (YYYY-MM-DD)
        required: true
        default: '2026-08-01'
      alpha_threshold:
        description: P1 alpha gate threshold
        required: true
        default: '0.10'

permissions:
  contents: read

jobs:
  research:
    name: Walk-forward NSE research
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run official NSE OOS comparison
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/run_nse_oos_experiment.py \
            --start '${{ inputs.start_date }}' \
            --end '${{ inputs.end_date }}' \
            --alpha-threshold '${{ inputs.alpha_threshold }}' \
            --output nse_oos_comparison.json
      - name: Publish research report
        uses: actions/upload-artifact@v4
        with:
          name: nse-oos-comparison-${{ inputs.start_date }}-${{ inputs.end_date }}
          path: nse_oos_comparison.json
          if-no-files-found: error
