name: Walk-Forward OOS Validation

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Historical start date (YYYY-MM-DD)'
        required: true
        default: '2023-08-01'
      end_date:
        description: 'Historical end date (YYYY-MM-DD)'
        required: true
        default: '2026-08-24'
      train_days:
        description: 'Training trading days'
        required: true
        default: '504'
      validation_days:
        description: 'Validation trading days'
        required: true
        default: '126'
      test_days:
        description: 'OOS test trading days'
        required: true
        default: '126'
      step_days:
        description: 'Walk-forward step in trading days'
        required: true
        default: '126'
      prepare_data:
        description: 'Download official NSE historical bhavcopies and build OOS dataset'
        required: true
        default: 'true'
        type: boolean

env:
  OOS_START: ${{ inputs.start_date || '2023-08-01' }}
  OOS_END: ${{ inputs.end_date || '2026-08-24' }}
  OOS_TRAIN: ${{ inputs.train_days || '504' }}
  OOS_VALIDATION: ${{ inputs.validation_days || '126' }}
  OOS_TEST: ${{ inputs.test_days || '126' }}
  OOS_STEP: ${{ inputs.step_days || '126' }}

jobs:
  oos-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 180
    steps:
      - name: Checkout strategy branch
        uses: actions/checkout@v4
        with:
          ref: feat/oos-validation-runner-9

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build survivorship-safe NSE OOS dataset
        run: |
          python scripts/build_oos_dataset.py \
            --start "$OOS_START" \
            --end "$OOS_END" \
            --output artifacts/oos_data

      - name: Validate prepared dataset
        run: |
          test -f artifacts/oos_data/_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('artifacts/oos_data/_manifest.json').read_text())
          print(json.dumps(m, indent=2))
          if m['successful_days'] <= 0 or m['symbols'] <= 0:
              raise SystemExit('OOS dataset preparation produced no usable history')
          if m['failed_days'] > max(60, int(m['attempted_days'] * 0.10)):
              raise SystemExit(f"Too many failed historical days: {m['failed_days']}/{m['attempted_days']}")
          PY

      - name: Run strict OOS validation
        run: |
          python scripts/run_oos_validation.py \
            --data-dir artifacts/oos_data \
            --train-days "$OOS_TRAIN" \
            --validation-days "$OOS_VALIDATION" \
            --test-days "$OOS_TEST" \
            --step-days "$OOS_STEP" \
            --output artifacts/oos_validation.json

      - name: Upload OOS report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oos-validation-report
          path: artifacts/oos_validation.json
          if-no-files-found: warn

      - name: Upload dataset diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oos-dataset-diagnostics
          path: artifacts/oos_data/_manifest.json
          if-no-files-found: warn
