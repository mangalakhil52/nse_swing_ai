name: 15-Day Paper Trading Telegram Alerts

on:
  schedule:
    # 16:15 IST = 10:45 UTC. Allows time for official NSE EOD files to be published.
    - cron: '45 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-telegram-daily
  cancel-in-progress: false

jobs:
  paper-alert:
    name: EOD paper signal + Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install project and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run EOD paper scan and send Telegram
        env:
          PYTHONPATH: ${{ github.workspace }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/run_daily_scan.py --telegram-required

      - name: Record experiment marker
        if: always()
        run: |
          echo "15-day paper validation window: 2026-09-08 through 2026-09-28"
          echo "Signal mode: paper/shadow only; no broker execution"
