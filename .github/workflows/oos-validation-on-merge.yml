name: One-shot OOS Validation

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: NSE OOS validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run OOS experiment
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/run_nse_oos_experiment.py \
            --start '2022-01-01' \
            --end '2026-08-01' \
            --alpha-threshold '0.10' \
            --output nse_oos_comparison.json
      - name: Publish report
        uses: actions/upload-artifact@v4
        with:
          name: nse-oos-validation
          path: nse_oos_comparison.json
          if-no-files-found: error
